<div class="container py-5">
    <div class="row">
        <div class="col-12 col-lg-8 offset-lg-2">

            <h1 id="accountGreeting"></h1>

            <!-- Meine Daten -->
            <hr>
            <div class="d-flex align-items-center gap-3">
                <h2 class="mb-0">Meine Daten</h2>
                <a href="#registrieren" class="btn btn-secondary btn-sm">
                    <i class="bi bi-pencil me-1"></i>Bearbeiten
                </a>
            </div>

            <div class="row g-3 mt-1">
                <div class="col-6">
                    <label style="font-weight: bold;">Vorname</label>
                    <p id="displayName" class="form-control-plaintext"></p>
                </div>
                <div class="col-6">
                    <label style="font-weight: bold;">Nachname</label>
                    <p id="displaySurname" class="form-control-plaintext"></p>
                </div>
                <div class="col-6">
                    <label style="font-weight: bold;">E-Mail</label>
                    <p id="displayMail" class="form-control-plaintext"></p>
                </div>
                <div class="col-6">
                    <label style="font-weight: bold;">Nutzername</label>
                    <p id="displayLoginName" class="form-control-plaintext"></p>
                </div>
                <div class="col-12">
                    <label style="font-weight: bold;">Rechnungsadresse</label>
                    <p id="displayAdress" class="form-control-plaintext"></p>
                </div>
            </div>

            <!-- Lieferadressen -->
            <hr class="mt-4">
            <h2>Lieferadressen</h2>
            <div id="displayDeliveryList" class="row g-3 mt-1"></div>
            <p id="displayDeliveryEmpty" class="text-muted mt-2">Keine Lieferadressen gespeichert.</p>

            <!-- Bestellungen -->
            <hr class="mt-4">
            <div class="d-flex justify-content-between align-items-center">
                <h2 class="mb-0">Meine Bestellungen</h2>
                <div id="orderToolbar"></div>
            </div>
            <div id="displayOrderList" class="mt-2"></div>
            <p id="displayOrderEmpty" class="text-muted mt-2">Noch keine Bestellungen vorhanden.</p>

            <!-- Abmelden -->
            <hr class="mt-4">
            <button id="buttonLogout" class="btn btn-secondary">
                <i class="bi bi-box-arrow-right me-2"></i>Abmelden
            </button>

        </div>
    </div>
</div>
