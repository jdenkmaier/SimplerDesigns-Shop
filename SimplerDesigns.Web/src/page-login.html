<div class="container-fluid">

    <div class="row mt-5 bg-bild">
        <div class="col-12 offset-lg-4 col-lg-4 py-4" style="background-color: #f5f5f588;">


            <div class="row">
                <div class="col-12 text-center">
                    <img src="./../../images/LoginLogo.png" style="width: 200px;" title="login"/>
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-12">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="textLoginName" placeholder="">
                        <label for="textLoginName">Nutzername</label>
                    </div>
                </div>
            </div>

            <div class="row mt-2">
                <div class="col-12">
                    <div class="form-floating">
                        <input type="password" class="form-control" id="textPassword" placeholder="Passwort">
                        <label for="textPassword">Passwort</label>
                    </div>        
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-6">
                    <button type="button" class="btn btn-primary w-100" id="buttonLogin">Login</button>
                </div>
                <div class="col-6">
                    <a href="#registrieren" class="btn btn-secondary w-100">Registrieren...</a>
                </div>
            </div>



        </div>
    </div>



</div>
