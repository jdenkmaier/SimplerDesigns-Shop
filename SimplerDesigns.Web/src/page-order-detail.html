<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="card-title mb-0">Bestellung</h5>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-outline-secondary" id="buttonBack">
        <i class="bi bi-arrow-left me-2"></i>Zurück
      </button>
    </div>
  </div>
  <div class="card-body">

    <div class="row mt-2">
      <div class="col-12 col-lg-3">
        <label class="form-label">Bestellnummer</label>
        <input type="text" id="textOrderNumber" class="form-control" readonly />
      </div>
      <div class="col-12 col-lg-3 mt-2 mt-lg-0">
        <label class="form-label">Datum</label>
        <input type="text" id="textOrderTime" class="form-control" readonly />
      </div>
      <div class="col-12 col-lg-3 mt-2 mt-lg-0">
        <label class="form-label">Kunde</label>
        <input type="text" id="textCustomerName" class="form-control" readonly />
      </div>
      <div class="col-12 col-lg-3 mt-2 mt-lg-0">
        <label class="form-label">Zahlungsmethode</label>
        <input type="text" id="textPaymethod" class="form-control" readonly />
      </div>
    </div>

    <div class="row mt-2">
      <div class="col-12 col-lg-3">
        <label class="form-label" for="selectStatus">Status</label>
        <select id="selectStatus" class="form-select"></select>
      </div>
    </div>

    <div class="row mt-4">
      <div class="col-12">
        <h6>Positionen</h6>
        <table class="table table-sm table-hover" id="tablePositions">
          <thead>
            <tr>
              <th>Artikel</th>
              <th class="text-end">Menge</th>
              <th class="text-end">Einzelpreis</th>
              <th class="text-end">Gesamt</th>
              <th class="text-center">Versendet</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="row justify-content-end">
      <div class="col-12 col-lg-4">
        <table class="table table-sm">
          <tbody>
            <tr>
              <td>Artikel (netto)</td>
              <td class="text-end" id="textPriceNetto"></td>
            </tr>
            <tr>
              <td>MwSt. (20%)</td>
              <td class="text-end" id="textPriceMwst"></td>
            </tr>
            <tr>
              <td>Artikel (brutto)</td>
              <td class="text-end" id="textPriceArticles"></td>
            </tr>
            <tr>
              <td>Versand</td>
              <td class="text-end" id="textPriceShipping"></td>
            </tr>
            <tr class="fw-bold">
              <td>Gesamt</td>
              <td class="text-end" id="textPriceTotal"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<div class="toast" role="alert" aria-live="assertive" aria-atomic="true" id="toastSave" style="position: absolute; bottom: 5rem; right: 5rem;"  data-bs-config='{"delay": 2000}'>
  <div class="toast-header">
    <strong class="me-auto">Speichern</strong>
    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
  </div>
  <div class="toast-body">Änderungen wurden gespeichert.</div>
</div>
