<div class="card ">
  <div class="card-header">
    <h5 class="card-title mb-0">Artikel Detail | Stamm</h5>
  </div>
  <div class="card-body">
    <div class="row">  
      <div class="col-12 d-flex gap-4 mt-2 mt-lg-4 justify-content-end">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="checkboxHide" />
          <label class="form-check-label" for="checkboxHide">Verstecken</label>
       </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="checkboxHighlight" />
          <label class="form-check-label" for="checkboxHighlight">Highlight</label>
        </div>
      </div>
    </div>

    <div class="row mt-2">
      <div class="col-12 col-lg-4">
        <label for="textNumber">Artikelnummer</label>
        <input type="text" id="textNumber" class="form-control" />
      </div>
      <div class="col-12 col-lg-8 mt-2 mt-lg-0">
        <label for="textName">Name</label>
        <input type="text" id="textName" class="form-control" />
      </div>
      </div>
      <div class="row mt-3"> 
        <div class="col-4 col-lg-4 mt-2 mt-lg-0">
          <label for="numberCategory">Kategorie</label>
          <select id="numberCategory" class="form-select">
            <option value="">Keine</option>
          </select>
        </div>
        <div class="col-4 col-lg-4 mt-2 mt-lg-0">
          <label for="numberColor">Farbe</label>
          <select id="numberColor" class="form-select"></select>
        </div>
        <div class="col-4 col-lg-4 mt-2 mt-lg-0">
          <label for="numberBrand">Marke</label>
          <select id="numberBrand" class="form-select"></select>
        </div>
      </div>


      <div class="row mt-3">
        <div class="col-12">
          <label for="textDescription">Beschreibung</label>
          <textarea id="textDescription" class="form-control" rows="3"></textarea>
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-12 col-lg-4">
          <label for="numberInventory">Anzahl</label>
          <input type="number" id="numberInventory" class="form-control" />
        </div>
        <div class="col-12 col-lg-4 mt-2 mt-lg-0">
          <label for="numberPrice">Preis</label>
          <div class="input-group">
            <input type="number" id="numberPrice" class="form-control" />
            <span class="input-group-text">€</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" role="alert" aria-live="assertive" aria-atomic="true" id="toastSave" style="position: absolute; bottom: 5rem; right: 5rem;"  data-bs-config='{"delay": 2000}'>
  <div class="toast-header">
    <strong class="me-auto">Speichern</strong>
    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
  </div>
  <div class="toast-body">
    
  </div>
</div>
