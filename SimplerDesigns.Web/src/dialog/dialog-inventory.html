<div class="modal fade" id="modalInventory" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="modalTitleDialogInventory" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header ">
        <h1 class="modal-title fs-5" id="modalTitleDialogInventory">Edit inventory</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">

        <div class="row">
          <div class="col-6">
            <label for="numberAmountDialogInventory">Amount</label>
            <input type="number" id="numberAmountDialogInventory" class="form-control" />
          </div>
          <div class="col-6">
            <label for="selectOperationDialogInventory">Operation</label>
            <select id="selectOperationDialogInventory" class="form-select">
              <option value="1">In</option>
              <option value="2">Out</option>
            </select>
          </div>
        </div>

      </div>
      <div class="modal-footer ">
        <button type="button" class="btn btn-success" id="buttonSaveDialogInventory"><i class="bi bi-check-lg me-2"></i>Save</button>
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal"><i class="bi bi-x-lg me-2"></i>Cancel</button>
      </div>
    </div>
  </div>
</div>
